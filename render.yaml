# Render Blueprint: the NodeX P2P node and the email verifier.
# Render dashboard → New → Blueprint → pick this repository.
# The frontend (NodeX-frontend repository) is deployed on Vercel.
services:
  # P2P node: browsers join the network here (WebSockets over Render's HTTPS).
  # Its address appears in the logs as "browsers: NEXT_PUBLIC_BOOTSTRAP_PEERS=…".
  - type: web
    name: nodex-node
    runtime: docker
    plan: free
    dockerfilePath: ./p2p-node/Dockerfile
    dockerContext: ./p2p-node
    buildFilter:
      paths:
        - p2p-node/**
    envVars:
      # Keeps the node's identity (and so its address) the same across deploys.
      - key: NODE_KEY
        generateValue: true

  # Email verifier: sends and checks the sign-up email code. Nothing else.
  - type: web
    name: nodex-verifier
    runtime: docker
    plan: free
    dockerfilePath: ./email-verifier/Dockerfile
    dockerContext: ./email-verifier
    healthCheckPath: /healthz
    buildFilter:
      paths:
        - email-verifier/**
    envVars:
      - key: APP_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: OTP_SECRET
        generateValue: true
      # Email: Render's free plan blocks SMTP, so codes go out through Brevo's
      # email API over HTTPS (see README). Asked for when the Blueprint is created:
      - key: BREVO_API_KEY
        sync: false
      # Sender, e.g. NodeX <you@gmail.com>; must be a verified sender in Brevo.
      - key: SMTP_FROM
        sync: false
      # Your Vercel address, e.g. https://nodex.vercel.app (no trailing slash).
      - key: CORS_ORIGINS
        sync: false
